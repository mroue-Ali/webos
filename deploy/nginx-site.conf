# nginx site for serving webos on a public subdomain. Replace webos.example.com with yours,
# install it in sites-available, enable it, then run `certbot --nginx -d <your subdomain>`,
# which adds the HTTPS parts to this file. The README's "Public address" section has the
# commands.

# Slows down password guessing before it reaches webos (which throttles too).
limit_req_zone $binary_remote_addr zone=webos_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name webos.example.com;

    client_max_body_size 1m;

    location = /api/auth/login {
        limit_req zone=webos_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite rather than append: webos trusts this header only from nginx, so a
        # client can't spoof its address to dodge the login throttle.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live logs and container events are streamed: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
